<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>MADZ Paper Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#07040e;--card:#140a22;--line:#7b3cff55;--acc:#c46bff;--txt:#f4ebff;--mut:#9b88b4;--win:#3dff9a;--loss:#ff5d7a;--safe:env(safe-area-inset-bottom)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Share Tech Mono",monospace;background:#07040e;color:var(--txt)}
.app{max-width:480px;margin:0 auto;min-height:100%;padding:12px 12px calc(76px + var(--safe))}
.top{display:flex;justify-content:space-between;align-items:center}
h1{font-family:Orbitron,sans-serif;font-size:16px;letter-spacing:.6px}
.live{font-size:10px;color:var(--win)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--win);display:inline-block;margin-right:5px;box-shadow:0 0 8px var(--win)}
.hero{margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#1b0d2e,#100818)}
.eq{font-family:Orbitron,sans-serif;font-size:26px}
.row{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
.pill{flex:1;border:1px solid var(--line);border-radius:12px;padding:8px}
.pill span{display:block;color:var(--mut);font-size:10px}
.up{color:var(--win)}.down{color:var(--loss)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
button{font:12px "Share Tech Mono",monospace;border:1px solid var(--line);background:#ffffff0c;color:var(--txt);border-radius:12px;padding:11px;cursor:pointer}
button.on{background:#c46bff26;color:#e7c8ff;border-color:#c46bff}
.chips{display:flex;gap:6px;overflow:auto;padding-bottom:6px}
.chips button{padding:8px 10px;white-space:nowrap;border-radius:999px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:#160b24}
.av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#c46bff22;color:var(--acc);font-family:Orbitron,sans-serif}
.sym{font-size:14px}
.meta{color:var(--mut);font-size:11px;margin-top:2px}
.right{text-align:right}
.badge{display:inline-block;margin-top:4px;font-size:10px;border:1px solid currentColor;border-radius:999px;padding:2px 6px}
.s-bad{color:#ff5d7a}.s-mid{color:#ffd36a}.s-good{color:#3dff9a}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:auto;background:#12081d;border-top:1px solid var(--acc);border-radius:18px 18px 0 0;padding:14px 14px calc(16px + var(--safe));z-index:5;transform:translateY(110%);transition:.22s}
.sheet.show{transform:none}
.handle{width:42px;height:4px;border-radius:4px;background:#ffffff33;margin:0 auto 10px}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.dock{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.buy{background:#123226;border-color:#3dff9a;color:#3dff9a;font-size:15px;padding:14px}
.sell{background:#3a1420;border-color:#ff5d7a;color:#ff5d7a;font-size:15px;padding:14px}
nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);background:#0c0714f2;border-top:1px solid var(--line);padding:8px 8px calc(8px + var(--safe));z-index:4}
nav button{background:transparent}
.toast{position:fixed;left:16px;right:16px;top:12px;background:#1b0d2e;border:1px solid var(--acc);border-radius:12px;padding:10px;opacity:0;transition:.2s;z-index:6}
.toast.show{opacity:1}
.note{color:var(--mut);font-size:11px;line-height:1.4;margin:8px 0}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>MADZ DESK</h1><div class="live"><i class="dot"></i><span id="status">CONNECTING</span></div></div>
    <div class="meta" id="clock"></div>
  </div>
  <section class="hero">
    <div class="meta">PAPER EQUITY</div>
    <div class="eq" id="eq">1.0000 SOL</div>
    <div class="row">
      <div class="pill"><span>CASH</span><b id="cash">1.0000</b></div>
      <div class="pill"><span>OPEN</span><b id="openN">0</b></div>
      <div class="pill"><span>P/L</span><b id="pnl">0.0000</b></div>
    </div>
  </section>
  <div class="seg">
    <button id="mManual" class="on">MANUAL</button>
    <button id="mAuto">AUTO</button>
  </div>
  <div class="chips" id="filters">
    <button class="on" data-f="all">ALL</button>
    <button data-f="clean">7+ CLEANER</button>
    <button data-f="risk">1-3 RISK</button>
    <button data-f="held">HELD</button>
  </div>
  <div id="coins" class="list"></div>
  <div id="book" class="list" hidden></div>
  <div id="fills" class="list" hidden></div>
</div>
<nav>
  <button class="on" data-v="coins">MARKETS</button>
  <button data-v="book">POSITIONS</button>
  <button data-v="fills">FILLS</button>
</nav>
<div class="sheet" id="sheet">
  <div class="handle"></div>
  <div class="row">
    <div><div class="sym" id="tSym">—</div><div class="meta" id="tMeta"></div></div>
    <div class="badge" id="tScore">—</div>
  </div>
  <div class="eq" id="tPx" style="font-size:22px;margin-top:8px">—</div>
  <div class="note" id="tWhy"></div>
  <div class="sizes" id="sizes"></div>
  <div class="dock">
    <button class="buy" id="doBuy">BUY</button>
    <button class="sell" id="doSell">SELL</button>
  </div>
  <button id="closeSheet" style="width:100%;margin-top:8px">CLOSE</button>
</div>
<div class="toast" id="toast"></div>
<script>
const START=1, FEE=0.01, LS="madz_desk_v3";
let mode="manual", filter="all", coins=[], cash=START, positions=[], fills=[], size=0.05, selected=null;
const $=id=>document.getElementById(id);
const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1400)};
const n4=n=>Number(n).toFixed(4);
const fmt=n=>(n>=0?"+":"")+n4(n);
const money=n=>{n=Number(n||0); if(n>=1e6) return "$"+(n/1e6).toFixed(2)+"M"; if(n>=1e3) return "$"+(n/1e3).toFixed(1)+"k"; return "$"+Math.round(n)};
const px=n=>{n=Number(n||0); if(!n) return "—"; if(n>=1) return n.toFixed(4)+" SOL"; if(n>=0.001) return n.toFixed(6)+" SOL"; return n.toFixed(8)+" SOL"};
function save(){localStorage.setItem(LS,JSON.stringify({cash,positions,fills,size,mode}))}
function load(){try{const s=JSON.parse(localStorage.getItem(LS)||"{}"); if(typeof s.cash==="number") cash=s.cash; positions=s.positions||[]; fills=s.fills||[]; if(s.size) size=s.size; if(s.mode) mode=s.mode;}catch(e){}}
function scorePair(p){
  const liq=+p.liq||0, ageH=Math.max(0,(Date.now()-p.created)/36e5), vol=+p.vol||0, chg=+p.chg||0, buys=+p.buys||0, sells=+p.sells||0;
  let s=5;
  if(liq<5000)s-=3; else if(liq<20000)s-=2; else if(liq<80000)s-=1; else if(liq>250000)s+=2; else if(liq>100000)s+=1;
  if(ageH<1)s-=2; else if(ageH<6)s-=1; else if(ageH>72)s+=1;
  if(vol>liq*3 && liq<30000)s-=1;
  if(vol>50000 && liq>50000)s+=1;
  if(sells>buys*1.6)s-=1;
  if(chg>80 && liq<40000)s-=2;
  if(chg<-40)s-=1;
  s=Math.max(1,Math.min(10,Math.round(s)));
  const why=[];
  why.push(liq<20000?"thin liquidity":"liquidity "+money(liq));
  why.push(ageH<6?"pool is new":"pool age ok");
  if(sells>buys*1.4) why.push("sell pressure");
  if(chg>50 && liq<40000) why.push("spike on thin book");
  return {s, why:why.join(" · ")};
}
function tag(s){return s<=3?"s-bad":s<=6?"s-mid":"s-good"}
function lab(s){return s+"/10 "+(s<=3?"RISK":s<=6?"MIXED":"CLEANER")}
async function fetchLive(){
  $("status").textContent="SCANNING";
  const out=[];
  try{
    const r=await fetch("https://api.geckoterminal.com/api/v2/networks/solana/trending_pools?page=1");
    const j=await r.json();
    (j.data||[]).forEach(p=>{
      const a=p.attributes||{}, name=(a.name||"").split("/")[0].trim();
      if(!name||/^(SOL|WSOL|USDC|USDT)$/i.test(name)) return;
      const tx=(a.transactions||{}).h1||{};
      out.push({id:a.address,sym:name,price:+a.base_token_price_native_currency||0,liq:+a.reserve_in_usd||0,vol:+(a.volume_usd||{}).h1||0,chg:+(a.price_change_percentage||{}).h1||0,buys:tx.buys||0,sells:tx.sells||0,created:Date.parse(a.pool_created_at||0)||Date.now()});
    });
  }catch(e){}
  const map={};
  out.forEach(c=>{const sc=scorePair(c); c.score=sc.s; c.why=sc.why; if(!map[c.sym]||c.liq>map[c.sym].liq) map[c.sym]=c;});
  coins=Object.values(map).sort((a,b)=>b.score-a.score||b.liq-a.liq).slice(0,24);
  positions.forEach(p=>{const c=coins.find(x=>x.sym===p.sym); if(c&&c.price>0) p.last=c.price;});
  $("status").textContent=coins.length?("LIVE · "+coins.length+" POOLS"):"FEED DOWN";
  render();
}
function equity(){return cash+positions.reduce((s,p)=>s+p.qty*p.last,0)}
function render(){
  const eq=equity(), pnl=eq-START;
  $("eq").textContent=n4(eq)+" SOL";
  $("cash").textContent=n4(cash);
  $("openN").textContent=positions.length;
  $("pnl").textContent=fmt(pnl);
  $("pnl").className=pnl>=0?"up":"down";
  const list=coins.filter(c=>{
    if(filter==="clean") return c.score>=7;
    if(filter==="risk") return c.score<=3;
    if(filter==="held") return positions.some(p=>p.sym===c.sym);
    return true;
  });
  $("coins").innerHTML=list.map(c=>{
    const pos=positions.find(p=>p.sym===c.sym);
    return `<button class="item" onclick="openTicket('${c.sym}')"><div class="av">${c.sym.slice(0,1)}</div><div><div class="sym">${c.sym}${pos?" · HELD":""}</div><div class="meta">liq ${money(c.liq)} · 1h vol ${money(c.vol)}</div></div><div class="right"><div class="${c.chg>=0?"up":"down"}">${c.chg>=0?"+":""}${Number(c.chg).toFixed(1)}%</div><div class="badge ${tag(c.score)}">${lab(c.score)}</div></div></button>`;
  }).join("")||`<div class="pill">No markets in this filter.</div>`;
  $("book").innerHTML=positions.length?positions.map(p=>{
    const pnl=p.qty*(p.last-p.entry), pct=p.entry?(p.last/p.entry-1)*100:0;
    return `<div class="item"><div class="av">${p.sym.slice(0,1)}</div><div><div class="sym">${p.sym}</div><div class="meta">${n4(p.qty*p.last)} SOL · ${pct>=0?"+":""}${pct.toFixed(1)}%</div></div><button class="sell" onclick="sell('${p.sym}')">SELL ${fmt(pnl)}</button></div>`;
  }).join(""):`<div class="pill">No open paper positions. Tap a market to buy.</div>`;
  $("fills").innerHTML=fills.slice().reverse().slice(0,40).map(f=>`<div class="item"><div class="av">${f.side[0]}</div><div><div class="sym">${f.side} ${f.sym}</div><div class="meta">${new Date(f.ts).toLocaleTimeString()} · ${f.note||""}</div></div><b class="${f.pnl>=0?"up":"down"}">${f.side==="SELL"?fmt(f.pnl):n4(f.sol)}</b></div>`).join("")||`<div class="pill">No fills yet.</div>`;
  $("mManual").classList.toggle("on", mode==="manual");
  $("mAuto").classList.toggle("on", mode==="auto");
}
function openTicket(sym){
  const c=coins.find(x=>x.sym===sym); if(!c) return;
  selected=c;
  $("tSym").textContent=c.sym;
  $("tMeta").textContent="liq "+money(c.liq)+" · buys "+c.buys+" / sells "+c.sells;
  $("tPx").textContent=px(c.price);
  $("tScore").textContent=lab(c.score);
  $("tScore").className="badge "+tag(c.score);
  $("tWhy").textContent=c.why+". Paper only, 1% fee. A high score is not a promise.";
  $("sizes").innerHTML=[0.02,0.05,0.1,0.25].map(v=>`<button class="${v===size?"on":""}" onclick="setSize(${v})">${v}</button>`).join("");
  const pos=positions.find(p=>p.sym===sym);
  $("doSell").disabled=!pos;
  $("doSell").textContent=pos?"SELL "+fmt(pos.qty*(pos.last-pos.entry)):"SELL";
  $("sheet").classList.add("show");
}
function setSize(v){size=v; save(); if(selected) openTicket(selected.sym);}
function buy(sym){
  const c=coins.find(x=>x.sym===sym); if(!c||c.price<=0) return toast("No live price");
  const cost=size*(1+FEE); if(cost>cash) return toast("Not enough cash");
  if(c.score<=3 && mode==="manual" && !confirm(sym+" is "+c.score+"/10 rug risk. Paper buy anyway?")) return;
  cash-=cost; const qty=size/c.price; const pos=positions.find(p=>p.sym===sym);
  if(pos){pos.entry=(pos.entry*pos.qty+c.price*qty)/(pos.qty+qty); pos.qty+=qty; pos.last=c.price;}
  else positions.push({sym,qty,entry:c.price,last:c.price});
  fills.push({side:"BUY",sym,sol:size,pnl:0,ts:Date.now(),note:c.score+"/10"});
  save(); render(); toast("Bought "+size+" SOL of "+sym); if(selected) openTicket(sym);
}
function sell(sym){
  const i=positions.findIndex(p=>p.sym===sym); if(i<0) return toast("Nothing to sell");
  const p=positions[i], c=coins.find(x=>x.sym===sym); if(c&&c.price>0) p.last=c.price;
  const gross=p.qty*p.last, net=gross*(1-FEE), pnl=net-p.qty*p.entry;
  cash+=net; fills.push({side:"SELL",sym,sol:net,pnl,ts:Date.now(),note:"manual exit"}); positions.splice(i,1);
  save(); render(); toast("Sold "+sym+" "+fmt(pnl)+" SOL"); $("sheet").classList.remove("show");
}
function autoTick(){
  if(mode!=="auto") return;
  positions.slice().forEach(p=>{const ret=(p.last-p.entry)/p.entry; if(ret>=0.12||ret<=-0.08) sell(p.sym);});
  if(positions.length>=3||cash<0.04) return;
  const pick=coins.find(c=>c.score>=7 && !positions.some(p=>p.sym===c.sym) && c.price>0);
  if(pick){const old=size; size=0.03; buy(pick.sym); size=old;}
}
function show(v){
  $("coins").hidden=v!=="coins"; $("book").hidden=v!=="book"; $("fills").hidden=v!=="fills";
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.v===v));
  $("filters").style.display=v==="coins"?"flex":"none";
}
$("mManual").onclick=()=>{mode="manual"; save(); render(); toast("Manual. You tap buy and sell.")};
$("mAuto").onclick=()=>{mode="auto"; save(); render(); toast("Auto. 7+ only, +12% / -8%."); autoTick()};
$("doBuy").onclick=()=>selected&&buy(selected.sym);
$("doSell").onclick=()=>selected&&sell(selected.sym);
$("closeSheet").onclick=()=>$("sheet").classList.remove("show");
$("filters").onclick=e=>{const b=e.target.closest("button"); if(!b) return; filter=b.dataset.f; [...$("filters").children].forEach(x=>x.classList.toggle("on",x===b)); render()};
document.querySelector("nav").onclick=e=>{const b=e.target.closest("button"); if(b) show(b.dataset.v)};
setInterval(()=>{$("clock").textContent=new Date().toTimeString().slice(0,5)},1000);
setInterval(async()=>{await fetchLive(); if(mode==="auto") autoTick()},20000);
load(); render(); fetchLive();
</script>
</body>
</html>
