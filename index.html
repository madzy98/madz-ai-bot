<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>MADZ AI BOT — WebView Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #010302;
      --stage: #041108;
      --card: #07180c;
      --line: rgba(0,255,70,.32);
      --accent: #00ff41;
      --accent2: #9dffb4;
      --dim: rgba(0,255,65,.12);
      --text: #e3ffe8;
      --muted: #6f9a76;
      --win: #39ff88;
      --loss: #ff4d6d;
      --glow: 0 0 24px rgba(0,255,65,.25);
    }
    [data-theme="purple"] {
      --bg: #06030c;
      --stage: #10081a;
      --card: #160b24;
      --line: rgba(196,107,255,.34);
      --accent: #c46bff;
      --accent2: #8ad4ff;
      --dim: rgba(196,107,255,.14);
      --text: #f3e9ff;
      --muted: #8d7aa8;
      --win: #39ff88;
      --loss: #ff5d7a;
      --glow: 0 0 24px rgba(196,107,255,.28);
    }
    [data-theme="cyan"] {
      --bg: #01080c;
      --stage: #05151b;
      --card: #071c24;
      --line: rgba(0,229,255,.32);
      --accent: #00e5ff;
      --accent2: #7dffce;
      --dim: rgba(0,229,255,.14);
      --text: #ddfbff;
      --muted: #6d9098;
      --win: #3dff9a;
      --loss: #ff4d6d;
      --glow: 0 0 24px rgba(0,229,255,.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Share Tech Mono", monospace;
      background: radial-gradient(circle at 50% 20%, var(--stage), var(--bg) 58%);
      color: var(--text);
      overflow: hidden;
    }
    #rain { position: fixed; inset: 0; z-index: 0; opacity: .22; pointer-events: none; }

    .wrap {
      position: relative; z-index: 1; height: 100%;
      display: grid; place-items: center; padding: 12px;
    }
    .phone {
      width: min(430px, 100%);
      height: min(860px, 100%);
      background: linear-gradient(180deg, color-mix(in srgb, var(--card) 88%, black), var(--card));
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--glow), 0 30px 80px rgba(0,0,0,.45);
      display: grid;
      grid-template-rows: auto auto auto 1fr auto;
      overflow: hidden;
    }
    .status {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 16px 4px; font-size: 11px; color: var(--muted);
    }
    .dotlive { width: 7px; height: 7px; border-radius: 50%; background: var(--win); box-shadow: 0 0 8px var(--win); display: inline-block; margin-right: 6px; animation: pulse 1.4s infinite; }
    @keyframes pulse { 50% { opacity: .35 } }

    .head { padding: 4px 14px 10px; display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
    .brand { display: flex; gap: 8px; min-width: 0; }
    .logo {
      width: 34px; height: 34px; border: 1px solid var(--accent); color: var(--accent);
      display: grid; place-items: center; font-family: Orbitron, sans-serif; font-weight: 700; box-shadow: var(--glow);
    }
    h1 { font-family: Orbitron, sans-serif; font-size: 13px; letter-spacing: 1px; }
    .sub { color: var(--muted); font-size: 9px; margin-top: 2px; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; }
    button {
      font: 10px/1 "Share Tech Mono", monospace; letter-spacing: .4px;
      border: 1px solid var(--line); background: var(--dim); color: var(--text);
      padding: 6px 8px; border-radius: 999px; cursor: pointer;
    }
    button.active, button:hover { color: var(--accent); border-color: var(--accent); box-shadow: var(--glow); }

    .hero { padding: 0 14px 10px; }
    .hero-top { display: flex; justify-content: space-between; align-items: end; gap: 8px; }
    .big { font-family: Orbitron, sans-serif; font-size: 20px; color: var(--accent2); }
    .big small { font-size: 11px; color: var(--muted); display: block; font-family: "Share Tech Mono", monospace; }
    .pills { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
    .pill { border: 1px solid var(--line); border-radius: 10px; padding: 7px 6px; background: rgba(0,0,0,.22); }
    .pill span { display: block; color: var(--muted); font-size: 8px; }
    .pill b { font-size: 11px; }
    .up { color: var(--win) !important; }
    .down { color: var(--loss) !important; }

    .chartbox { position: relative; height: 148px; margin-top: 8px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: rgba(0,0,0,.18); }
    #equity { width: 100%; height: 100%; display: block; }
    .live { position: absolute; left: 8px; top: 7px; font-size: 10px; color: var(--accent); }

    .tabs { display: flex; gap: 6px; padding: 0 14px 8px; }
    .tabs button { flex: 1; }

    .body { min-height: 0; overflow: auto; padding: 0 14px 10px; }
    .trade {
      display: grid; grid-template-columns: 28px 1fr auto auto; gap: 8px; align-items: center;
      border: 1px solid transparent; border-bottom-color: rgba(255,255,255,.05);
      padding: 7px 4px; cursor: pointer;
    }
    .trade:hover { background: var(--dim); border-color: var(--line); border-radius: 8px; }
    .ico {
      width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
      font-size: 13px; background: var(--dim); border: 1px solid var(--line);
    }
    .tok { font-size: 11px; }
    .tok em { font-style: normal; color: var(--muted); font-size: 9px; display: block; }
    .tag { font-size: 9px; border: 1px solid currentColor; border-radius: 999px; padding: 2px 6px; }

    .foot {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 14px 12px; color: var(--muted); font-size: 9px; border-top: 1px solid var(--line);
    }
    .bar { display: none; }
    .toast {
      position: absolute; left: 16px; right: 16px; bottom: 54px;
      background: color-mix(in srgb, var(--card) 80%, black);
      border: 1px solid var(--accent); color: var(--accent2);
      border-radius: 10px; padding: 8px 10px; font-size: 11px;
      opacity: 0; transform: translateY(8px); transition: .25s; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: none; }

    @media (max-width: 480px) {
      .wrap { padding: 0; }
      .phone { width: 100%; height: 100%; border-radius: 0; border: none; }
    }
  </style>
</head>
<body data-theme="matrix">
  <canvas id="rain"></canvas>
  <div class="wrap">
    <div class="phone" id="phone">
      <div class="status">
        <span><i class="dotlive"></i><span id="clock">03:39</span></span>
        <span id="mode">PAPER · LIVE MARKET</span>
      </div>
      <div class="head">
        <div class="brand">
          <div class="logo">M</div>
          <div>
            <h1>MADZ AI BOT</h1>
            <div class="sub" id="subtitle">PAPER TRADING · REAL LOGIC</div>
          </div>
        </div>
        <div class="chips">
          <button data-s="hour" class="active">1H</button>
          <button data-s="campaign">5M</button>
          <button data-s="sprint">RUN</button>
          <button data-t="matrix" class="active">MATRIX</button>
          <button data-t="purple">NEON</button>
          <button data-t="cyan">CYAN</button>
        </div>
      </div>
      <div class="hero">
        <div class="hero-top">
          <div>
            <small id="path" style="color:var(--muted);font-size:10px">1.00 SOL → 3.70 SOL</small>
            <div class="big" id="pnl">+0.00 SOL</div>
          </div>
          <div style="text-align:right">
            <div class="big" id="mult">x1.00</div>
            <small id="winrate">0% WIN</small>
          </div>
        </div>
        <div class="pills" id="stats"></div>
        <div class="chartbox">
          <div class="live" id="live">SCANNING...</div>
          <canvas id="equity"></canvas>
        </div>
      </div>
      <div class="tabs">
        <button class="active" data-tab="trades">TRADES</button>
        <button data-tab="stats">STATS</button>
        <button id="replay">REPLAY</button>
        <button id="tick">LIVE TICK</button>
      </div>
      <div class="body" id="body"></div>
      <div class="foot">
        <span id="foot">MADZ AI · WEBVIEW TEST</span>
        <span>RISK MANAGED.</span>
      </div>
      <div class="toast" id="toast"></div>
    </div>
  </div>

  <script>
    const ICO = {
      MOONCAT:"🐱", PEPEAI:"🐸", DOGWIFHAT2:"🐶", TRUMPKITTY:"🎩", SIGMACHAD:"🗿",
      NPC:"😐", FARTCOIN:"💨", CHILLGUY:"😎", APECOIN:"🦍", GIGAFOX:"🦊",
      RETARDO:"🤪", MOONJELLY:"🪼", SKYAI:"☁️", PEPE2:"🐸", LUCKYDOG:"🍀",
      NEOPEPE:"🟢", SHIBOOM:"💥", SOLZILLA:"🦖", AIKONG:"🤖", PEPENOVA:"✨",
      DOGENAI:"🐕", TRUMPY:"🦅", REKT:"💀", SOLFROG:"🐸", FROGME:"🐸",
      SKIBIDI:"🚽", AIPEPE:"🧠", TRUMPET:"🎺", SIGMA:"Σ", DOGAI:"🦴",
      RETARDIO:"🎢", CATGPT:"😺"
    };

    const sessions = {
      hour: {
        title: "1 HOUR SESSION", date: "2026-09-21",
        start: 0.5003, final: 32.1158, profit: 31.6155, pct: 6311.2,
        trades: 52, wins: 34, losses: 18, winRate: 65.4, fees: 4.8927,
        dd: -6.3812, duration: "1h 07m 05s",
        quote: "DISCIPLINE FINDS OPPORTUNITY",
        points: [0.50,0.72,1.18,2.58,1.71,2.05,3.90,8.12,9.05,6.40,13.80,16.10,14.10,18.70,24.90,27.40,32.12],
        rows: [
          ["MOONCAT",0.0813,0.1347,"+0.0534","+65.6%","4m 27s","WIN"],
          ["PEPEAI",0.1426,0.3981,"+0.2555","+179.2%","9m 11s","WIN"],
          ["DOGWIFHAT2",0.1104,0.0798,"-0.0306","-27.7%","3m 52s","LOSS"],
          ["TRUMPKITTY",0.0957,0.6123,"+0.5166","+540.0%","11m 04s","WIN"],
          ["SIGMACHAD",0.2041,0.1522,"-0.0519","-25.4%","4m 16s","LOSS"],
          ["NPC",0.1325,0.4871,"+0.3546","+267.6%","7m 33s","WIN"],
          ["FARTCOIN",0.0788,0.1164,"+0.0376","+47.7%","3m 21s","WIN"],
          ["CHILLGUY",0.1653,0.1191,"-0.0462","-27.9%","4m 02s","LOSS"],
          ["APECOIN",0.0914,0.4217,"+0.3303","+361.5%","8m 26s","WIN"],
          ["GIGAFOX",0.1837,0.1389,"-0.0448","-24.4%","5m 11s","LOSS"],
          ["RETARDO",0.0761,0.2984,"+0.2223","+292.1%","6m 48s","WIN"],
          ["MOONJELLY",0.1209,0.0968,"-0.0241","-19.5%","2m 37s","LOSS"],
          ["SKYAI",0.1426,0.6129,"+0.4703","+329.7%","10m 03s","WIN"],
          ["PEPE2",0.0993,0.0851,"-0.0142","-14.3%","2m 41s","LOSS"],
          ["LUCKYDOG",0.1317,0.4291,"+0.2974","+225.8%","7m 56s","WIN"]
        ]
      },
      campaign: {
        title: "5 MINUTE CAMPAIGN", date: "2026-09-21 08:17 UTC",
        start: 1.00, final: 3.70, profit: 2.70, pct: 270,
        trades: 10, wins: 6, losses: 4, winRate: 60, fees: 0.08,
        dd: -0.066, duration: "5m 00s",
        quote: "DISCIPLINE TODAY. FREEDOM TOMORROW.",
        points: [1.00,1.08,1.16,1.22,1.40,1.55,1.68,1.95,2.20,2.48,2.72,2.96,3.18,3.44,3.70],
        rows: [
          ["NEOPEPE",0.100,1.000,"+0.900","+900%","2m 14s","WIN"],
          ["MOONCAT",0.100,0.760,"+0.660","+660%","3m 02s","WIN"],
          ["SHIBOOM",0.100,0.034,"-0.066","-66%","1m 21s","LOSS"],
          ["SOLZILLA",0.100,0.500,"+0.400","+400%","1m 44s","WIN"],
          ["AIKONG",0.100,0.086,"-0.014","-14%","58s","LOSS"],
          ["PEPENOVA",0.100,0.300,"+0.200","+200%","3m 11s","WIN"],
          ["DOGENAI",0.100,0.055,"-0.045","-45%","1m 37s","LOSS"],
          ["TRUMPY",0.100,0.200,"+0.100","+100%","1m 59s","WIN"],
          ["REKT",0.100,0.040,"-0.060","-60%","2m 05s","LOSS"],
          ["SOLFROG",0.100,0.200,"+0.100","+100%","3m 33s","WIN"]
        ]
      },
      sprint: {
        title: "5 MINUTE PAPER RUN", date: "2026-09-21",
        start: 1.0, final: 11.423671, profit: 10.423671, pct: 1042.37,
        trades: 10, wins: 8, losses: 2, winRate: 80, fees: 0.284166,
        dd: -0.191342, duration: "5m 16s",
        quote: "DATA TURNS VOLATILITY INTO OPPORTUNITY.",
        points: [1.00,1.20,1.55,1.38,1.72,2.45,2.18,3.15,3.48,4.85,5.62,6.41,7.18,8.70,11.42],
        rows: [
          ["MOONCAT",0.087,0.207,"+0.119","+136.6%","28s","WIN"],
          ["FROGME",0.092,0.341,"+0.249","+269.7%","41s","WIN"],
          ["SKIBIDI",0.099,0.613,"+0.513","+516.3%","37s","WIN"],
          ["AIPEPE",0.100,0.088,"-0.012","-12.5%","33s","LOSS"],
          ["TRUMPET",0.077,2.432,"+2.355","+3077%","52s","WIN"],
          ["SIGMA",0.099,0.421,"+0.323","+327.0%","46s","WIN"],
          ["CHILLGUY",0.084,0.063,"-0.021","-24.7%","31s","LOSS"],
          ["DOGAI",0.091,0.887,"+0.796","+871.5%","40s","WIN"],
          ["RETARDIO",0.074,1.125,"+1.051","+1430%","35s","WIN"],
          ["CATGPT",0.097,4.512,"+4.415","+4560%","58s","WIN"]
        ]
      }
    };

    let current = "hour";
    let tab = "trades";
    let liveOn = false;
    let liveTimer = null;
    let liveEq = [];
    let anim;

    const $ = id => document.getElementById(id);
    const s = () => sessions[current];

    function toast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 1600);
    }

    function renderStats() {
      const x = s();
      $("stats").innerHTML = [
        ["TRADES", x.trades],
        ["W / L", x.wins + " / " + x.losses],
        ["FEES", x.fees + ""],
        ["MAX DD", x.dd]
      ].map((a,i) => `<div class="pill"><span>${a[0]}</span><b class="${i===3?"down":""}">${a[1]}</b></div>`).join("");
    }

    function renderBody() {
      const x = s();
      if (tab === "stats") {
        $("body").innerHTML = `
          <div class="pill" style="margin-bottom:6px"><span>DURATION</span><b>${x.duration}</b></div>
          <div class="pill" style="margin-bottom:6px"><span>QUOTE</span><b>${x.quote}</b></div>
          <div class="pill" style="margin-bottom:6px"><span>DATE</span><b>${x.date}</b></div>
          <div class="pill"><span>STATUS</span><b class="up">PAPER SUCCESS</b></div>`;
        return;
      }
      $("body").innerHTML = x.rows.map(r => `
        <div class="trade" data-tok="${r[0]}">
          <div class="ico">${ICO[r[0]] || "◆"}</div>
          <div class="tok">${r[0]}<em>${r[1]} → ${r[2]} SOL · ${r[5]}</em></div>
          <div class="${r[6]==="WIN"?"up":"down"}">${r[3]}<br><em style="color:inherit;font-size:9px">${r[4]}</em></div>
          <span class="tag ${r[6]==="WIN"?"up":"down"}">${r[6]}</span>
        </div>`).join("");
    }

    function setHead(eq) {
      const x = s();
      const val = eq ?? x.final;
      const pnl = val - x.start;
      const pct = (pnl / x.start) * 100;
      $("path").textContent = `${x.start.toFixed(4)} SOL → ${val.toFixed(4)} SOL`;
      $("pnl").textContent = `${pnl>=0?"+":""}${pnl.toFixed(4)} SOL`;
      $("pnl").className = "big " + (pnl>=0?"up":"down");
      $("mult").textContent = "x" + (val / x.start).toFixed(2);
      $("winrate").textContent = `${x.winRate}% WIN · ${x.pct.toLocaleString()}%`;
      $("subtitle").textContent = `${x.title} · ${x.date}`;
      $("foot").textContent = `MADZ AI · ${x.title}`;
    }

    function drawChart(pts, t=1) {
      const c = $("equity");
      const dpr = Math.min(devicePixelRatio||1, 2);
      const w = c.clientWidth, h = c.clientHeight;
      if (!w || !h) return;
      c.width = w*dpr; c.height = h*dpr;
      const ctx = c.getContext("2d");
      ctx.scale(dpr,dpr);
      ctx.clearRect(0,0,w,h);
      const accent = getComputedStyle(document.body).getPropertyValue("--accent").trim();
      const n = Math.max(2, Math.floor(pts.length * t));
      const slice = pts.slice(0,n);
      const min = Math.min(...pts)*0.88, max = Math.max(...pts)*1.06;
      const X = i => 10 + i*((w-20)/Math.max(pts.length-1,1));
      const Y = v => h-14 - ((v-min)/(max-min||1))*(h-28);
      ctx.strokeStyle = "rgba(255,255,255,.07)";
      for (let i=0;i<3;i++){ const y=16+i*((h-30)/2); ctx.beginPath(); ctx.moveTo(8,y); ctx.lineTo(w-8,y); ctx.stroke(); }
      ctx.beginPath();
      slice.forEach((v,i)=> i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));
      ctx.strokeStyle = accent; ctx.lineWidth = 2; ctx.shadowColor = accent; ctx.shadowBlur = 10; ctx.stroke();
      ctx.shadowBlur = 0;
      const last = slice.at(-1);
      ctx.fillStyle = accent; ctx.beginPath(); ctx.arc(X(slice.length-1), Y(last), 3, 0, Math.PI*2); ctx.fill();
    }

    function play() {
      cancelAnimationFrame(anim);
      const pts = liveOn && liveEq.length ? liveEq : s().points;
      const start = performance.now();
      const tick = now => {
        const t = Math.min(1,(now-start)/1200);
        drawChart(pts, t);
        setHead(pts[Math.max(0, Math.floor((pts.length-1)*t))]);
        if (t<1) anim = requestAnimationFrame(tick);
      };
      anim = requestAnimationFrame(tick);
    }

    function render(animate=true) {
      document.querySelectorAll("[data-s]").forEach(b => b.classList.toggle("active", b.dataset.s===current));
      renderStats();
      renderBody();
      setHead(s().final);
      $("live").textContent = liveOn ? "LIVE TICK ON" : "PAPER SESSION";
      if (animate) play(); else drawChart(s().points,1);
    }

    function startLive() {
      liveOn = !liveOn;
      $("tick").classList.toggle("active", liveOn);
      clearInterval(liveTimer);
      if (!liveOn) { toast("LIVE TICK OFF"); liveEq = s().points.slice(); drawChart(liveEq,1); return; }
      toast("LIVE TICK · MATRIX FEED");
      liveEq = [s().start];
      liveTimer = setInterval(() => {
        const last = liveEq.at(-1);
        const target = s().final;
        const drift = (target-last)*0.08 + (Math.random()-0.42)*Math.max(0.04, last*0.03);
        liveEq.push(Math.max(0.05, last + drift));
        if (liveEq.length > 40) liveEq.shift();
        drawChart(liveEq,1);
        setHead(liveEq.at(-1));
        $("live").textContent = "TICK " + liveEq.at(-1).toFixed(4) + " SOL";
      }, 420);
    }

    document.querySelector(".chips").addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.s) { current = b.dataset.s; liveOn=false; clearInterval(liveTimer); liveEq=[]; $("tick").classList.remove("active"); render(true); }
      if (b.dataset.t) {
        document.body.dataset.theme = b.dataset.t;
        document.querySelectorAll("[data-t]").forEach(x => x.classList.toggle("active", x.dataset.t===b.dataset.t));
        drawChart(liveOn && liveEq.length ? liveEq : s().points, 1);
      }
    });
    document.querySelector(".tabs").addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.id==="replay") { liveOn=false; clearInterval(liveTimer); $("tick").classList.remove("active"); render(true); toast("REPLAY SESSION"); }
      else if (b.id==="tick") startLive();
      else { tab = b.dataset.tab; document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active", x===b)); renderBody(); }
    });
    $("body").addEventListener("click", e => {
      const row = e.target.closest(".trade"); if (!row) return;
      toast(row.dataset.tok + " · SIGNAL LOCKED");
    });

    function rain() {
      const c = $("rain"), ctx = c.getContext("2d");
      const g = "01アイウエオカキクケコMADZSOL¥$#<>/";
      let cols, drops;
      const resize = () => {
        c.width = innerWidth; c.height = innerHeight;
        cols = Math.floor(c.width/16);
        drops = Array.from({length:cols}, () => Math.random()*c.height);
        drawChart(s().points,1);
      };
      addEventListener("resize", resize); resize();
      (function loop(){
        ctx.fillStyle = "rgba(0,0,0,.08)"; ctx.fillRect(0,0,c.width,c.height);
        ctx.fillStyle = getComputedStyle(document.body).getPropertyValue("--accent").trim();
        ctx.font = "12px Share Tech Mono";
        drops.forEach((y,i)=>{ ctx.fillText(g[Math.floor(Math.random()*g.length)], i*16, y); drops[i] = y>c.height && Math.random()>0.975 ? 0 : y+14; });
        requestAnimationFrame(loop);
      })();
    }
    function clock() {
      const d = new Date();
      $("clock").textContent = d.toTimeString().slice(0,5);
    }
    setInterval(clock, 1000); clock();
    render(true); rain();
  </script>
</body>
</html>
